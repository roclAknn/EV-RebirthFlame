<!DOCTYPE html>
<html>
  <head>
    <title>/MapleStory/ 転生の炎の確率計算器</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="vkAHjrHWlxI9ch267E96FHR8p9ajVqys8hCnFSBES8A" />
    <meta name="description" content="メイプルストーリー計算ツール　転生の炎がいくつ必要か、転生スコアごとに平均値を計算します" />
    <script src='decimal.min.js'></script>
    <script src='bignumber.min.js'></script>
    <script src="header.js"></script>
    <script src="common.js"></script>
    <script src="main.js"></script>
    <script src="calc.js"></script>
    <link rel="stylesheet" href="main.css">
  </head>
  <body onload="initialize()">
    <main>
      <div id="maindiv-wrapper">
        <div id="maindiv" class="flex isarmorselected issimpleatkselected">
          <div id="header-row" class="colflex">
            <!-- header-row  main-column -------------------------------------------------->
            <div id="main-column">
              <div id="eqptype-container" class="cell join flex">
                <div class="eqptype-button eqptype-weapon" data-type="武器">
                  武器
                </div>
                <div class="eqptype-button eqptype-armor selected" data-type="防具">
                  防具
                </div>
                <input type="checkbox" id="input-isarmor" class="input-status" hidden checked>
              </div>

              <div class="cell label">
                <label for="input-eqplv">装備レベル</label>
              </div>
              <div class="cell input">
                <input id="input-eqplv" class="input-status" value="200" type="number" step=1>
              </div>
              
              <div class="cell label">
                <label for="input-min">出力の最低値</label>
              </div>
              <div class="cell input">
                <input id="input-min" name="min" type="number" class="input-status no-spin" step="1" value="100">
              </div>
              
              
              <div class="cell join">
                <div id="button-isboss" class="divbutton active"
                 data-input="#input-isboss" data-togglecln="isbossselected">
                  ボス装備 BONUS
                </div>
                <input id="input-isboss" class="input-status" type="checkbox" checked hidden>
              </div>

              <div class="cell join">
                <div id="button-issimpleatk" class="divbutton notarmor active"
                 data-input="#input-issimpleatk" data-togglecln="issimpleatkselected">
                  武器A/MA 簡易版
                </div>
                <input id="input-issimpleatk" class="input-status" type="checkbox" checked hidden>
              </div>
              
              <div class="cell label">
                <label for="input-simpleatk" class="issimpleatk notarmor">A/MAランク</label>
                <label for="input-weaponatk" class="notsimpleatk notarmor">武器 素A/MA</label>
              </div>
              <div class="cell input">
                <select id="input-simpleatk" class="input-status issimpleatk notarmor"></select>
                <input id="input-weaponatk" type="number" class="input-status notsimpleatk notarmor" value="400">
              </div>
            </div>

            <!-- header-row  sub-column ------------------------------------------------->
            <div id="sub-column" class="flex">
              <div id="status-template-row">
                <label for="status-template">転生スコア基準</label>
              </div>
              <div id="status-table"></div>
            </div>
          </div>


          <!-- condition-row ------------------------------------------>
          <div id="condition-row" class="colflex">
            <div class="opener"></div>
            <button id="export-button">出力</button>
            <div id="condition-expantion-container">
              <div id="condition-eqptype"></div>
              <div id="condition-eqptype-text"></div>
            </div>
            <input id="export-numinput" type="number" value="1" min="1" step="1">
            <div id="export-typediv" style="align-content: center;"></div>
            <select id="export-type" hidden></select>
            <div id="align-panesdiv" style="height: 30px;" title="並び替えなし" data-mode="none">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 50" style="height:100%">
                <rect x="6" y="6" width="18" height="7" fill="white" stroke="#333" stroke-width="1.5"/>
                <rect x="6" y="21" width="18" height="7" fill="white" stroke="#333" stroke-width="1.5"/>
                <rect x="6" y="36" width="18" height="7" fill="white" stroke="#333" stroke-width="1.5"/>
                <rect x="36" y="6" width="18" height="7" fill="white" stroke="#333" stroke-width="1.5"/>
                <rect x="36" y="36" width="18" height="7" fill="white" stroke="#333" stroke-width="1.5"/>
                <line x1="24" y1="9.5" x2="36" y2="9.5" stroke="#333" stroke-width="2"/>
                <line x1="24" y1="39.5" x2="36" y2="39.5" stroke="#333" stroke-width="2"/>
                <path class="stopmark" stroke="red" d="M55 5 L5 45" stroke-width="4" fill="#f44"/>
                <text class="align-mode-label" x="30" y="27" text-anchor="middle" dominant-baseline="central"
                      font-size="32" font-weight="bold" fill="#333" font-family="sans-serif"></text>
              </svg>
            </div>
            <select id="align-panes" hidden>
              <option value="none" selected></option>
              <option value="score"></option>
              <option value="prob"></option>
            </select>
          </div>

          <!-- export-row ------------------------------------------>
          <div id="export-row" class="colflex"></div>
        </div>
      </div>
    </main>
    <script>
    </script>
  </body>
</html>
